name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Check generated API server is up to date
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0 -config codegen/oapi-codegen.yaml openapi.yaml
          git diff --exit-code internal/apiserver

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t app-name:${{ github.sha }} .
