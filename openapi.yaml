openapi: 3.0.3

info:
  title: App Name API
  description: API to configure the App Name app. BuildingPro Suites renders the configuration form from the Configuration schema.
  version: 1.0.0

externalDocs:
  description: Developer guide
  url: https://github.com/eliona-smart-building-assistant/app-template/blob/main/docs/DEVELOPMENT.md

servers:
  - url: http://app-name/v1

tags:
  - name: Configuration
    description: Configure the app
  - name: Version
    description: API version

paths:
  /configs:
    get:
      tags: [Configuration]
      summary: List configurations
      operationId: listConfigurations
      responses:
        "200":
          description: All configurations of the app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Configuration"
    post:
      tags: [Configuration]
      summary: Create a configuration
      operationId: createConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
      responses:
        "201":
          description: Configuration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "400":
          $ref: "#/components/responses/BadRequest"

  /configs/{configId}:
    parameters:
      - $ref: "#/components/parameters/ConfigId"
    get:
      tags: [Configuration]
      summary: Get a configuration
      operationId: getConfiguration
      responses:
        "200":
          description: The configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Configuration]
      summary: Update a configuration
      description: An omitted apiKey keeps the stored key.
      operationId: updateConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Configuration]
      summary: Delete a configuration
      operationId: deleteConfiguration
      responses:
        "204":
          description: Configuration deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /version:
    get:
      tags: [Version]
      summary: Version of the app
      operationId: getVersion
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /version/openapi.json:
    get:
      tags: [Version]
      summary: OpenAPI specification of this API
      operationId: getOpenAPI
      responses:
        "200":
          description: The specification as JSON
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    ConfigId:
      name: configId
      in: path
      required: true
      description: ID of the configuration
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The configuration does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Configuration:
      type: object
      description: Connection to one vendor account. Field types and formats drive the generated form.
      required: [url]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: ID of the configuration
        url:
          type: string
          format: uri
          description: Base URL of the vendor API
          example: http://fake-vendor:8080
        apiKey:
          type: string
          format: password
          writeOnly: true
          description: API key of the vendor account
        enable:
          type: boolean
          default: true
          description: Poll the vendor API
        refreshInterval:
          type: integer
          format: int32
          default: 60
          minimum: 10
          description: Seconds between two polls
        requestTimeout:
          type: integer
          format: int32
          default: 30
          minimum: 1
          description: Timeout of one vendor request in seconds
        projectIDs:
          type: array
          description: BuildingPro Suites projects to create the assets in
          x-eliona-bind: projects
          items:
            type: string
          example: ["1"]

    Version:
      type: object
      required: [timestamp, commit]
      properties:
        timestamp:
          type: string
          description: Build time
        commit:
          type: string
          description: Git commit of the build

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
